name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Isolated, throwaway services for this run only. Never point CI at shared databases.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veyra
          POSTGRES_PASSWORD: veyra
          POSTGRES_DB: veyra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U veyra -d veyra_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://veyra:veyra@localhost:5432/veyra_test?schema=public
      REDIS_URL: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Secret scanning (Phase 14): before dependencies are installed, so only our files are read.
      - name: Scan for secrets (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner
          rm gitleaks

      - run: bun install --frozen-lockfile
      # Known vulnerabilities in dependencies (high and critical fail the build).
      - run: bun audit --audit-level=high
      - run: bun run lint
      - run: bun run db:generate
      - run: bun run --cwd packages/db validate
      - run: bun run typecheck
      - run: bun run test
      # Starts its own throwaway PostgreSQL 17 (embedded-postgres), creates the veyra_owner /
      # veyra_app roles and applies the real migrations. Does not use the service container.
      # Throwaway S3-compatible storage (SeaweedFS) for the object storage contract test.
      - run: sh infra/seaweedfs/start-ci.sh
      - run: bun run test:integration
        env:
          STORAGE_TEST_ENDPOINT: http://localhost:8333
      - run: bun run build
      # Console browser journeys (Playwright, Chromium only) against the production build.
      - run: bunx playwright install --with-deps --no-shell chromium
      - run: bun run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/console-web/playwright-report
          retention-days: 7

  # The whole product in production mode (Phase 14 Part 4): built images, migrations, API,
  # worker and console together; a customer's first journey; then a backup restored and checked.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Start the full stack
        run: docker compose -f infra/compose/full-stack.yml up -d --build --wait

      - name: Smoke test
        run: bun infra/smoke/smoke.ts

      - name: Restore drill
        run: sh infra/scripts/restore-drill.sh

      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/compose/full-stack.yml logs --tail=200

      - name: Stop
        if: always()
        run: docker compose -f infra/compose/full-stack.yml down -v
