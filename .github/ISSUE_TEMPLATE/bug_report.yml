name: Bug report
description: Something is not working as expected
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Do not file it here. Email it privately (see SECURITY.md).
        Never paste real resident data, tokens or passwords.
  - type: dropdown
    id: app
    attributes:
      label: Where
      options:
        - api
        - worker
        - console-web
        - resident-mobile
        - marketing-web
        - admin-web
        - packages
        - CI / tooling
        - docs
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: textarea
    id: logs
    attributes:
      label: Logs, request ID or screenshots
      description: Include the `x-request-id` from the response if you have it.
      render: shell
