name: Feature request
description: Propose a new capability or an improvement
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem, and what are they trying to do?
    validations:
      required: true
  - type: dropdown
    id: persona
    attributes:
      label: Who is it for
      multiple: true
      options:
        - Organisation admin
        - Property manager
        - Committee member
        - Finance officer
        - Security staff
        - Maintenance staff
        - Owner / tenant / household member
        - Vendor
        - VEYRA staff (platform admin)
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - Given ... when ... then ...
  - type: textarea
    id: risks
    attributes:
      label: Permissions, data and privacy considerations
      description: Who may see or change this data? Any money, access or personal data involved?
