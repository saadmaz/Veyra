# The whole product on one machine (Phase 14 Part 4): PostgreSQL, Redis, migrations, API, worker
# and console, built from the repository's Dockerfile and run in production mode. Used by the CI
# smoke test (infra/smoke/smoke.ts) and for trying a release locally. Credentials and keys here
# are throwaway values for this stack only; real deployments read them from a secrets manager.
#
#   docker compose -f infra/compose/full-stack.yml up -d --build --wait
#   bun infra/smoke/smoke.ts
#   docker compose -f infra/compose/full-stack.yml down -v

x-app: &app
  image: veyra-app:local
  build:
    context: ../..
    dockerfile: Dockerfile
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgresql://veyra_app:veyra_app_dev@postgres:5432/veyra
    REDIS_URL: redis://redis:6379
    API_CORS_ORIGINS: http://localhost:3000
    CONSOLE_URL: http://localhost:3000
    LOG_FORMAT: json
    MFA_ENCRYPTION_KEY: c21va2UtdGVzdC1vbmx5LW1mYS1rZXktMDEyMzQ1Njc4OQ==
    WEBHOOK_SIGNING_KEY: c21va2UtdGVzdC1vbmx5LXdlYmhvb2sta2V5LTAxMjM0NQ==

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ../../packages/db/sql/bootstrap-roles.sql:/docker-entrypoint-initdb.d/10-bootstrap-roles.sql:ro
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d veyra"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    working_dir: /app/packages/db
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://veyra_owner:veyra_owner_dev@postgres:5432/veyra
    command: ["node", "/app/node_modules/prisma/build/index.js", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["node", "apps/api/dist/main.js"]
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 40

  worker:
    <<: *app
    command: ["node", "apps/worker/dist/main.js"]
    ports:
      - "4001:4001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4001/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 40

  console:
    <<: *app
    working_dir: /app/apps/console-web
    command: ["node", "/app/node_modules/next/dist/bin/next", "start", "-p", "3000"]
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/sign-in').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 40
