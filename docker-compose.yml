# Local development services. Application processes run on the host (bun run dev).
services:
  postgres:
    image: postgres:17-alpine
    # The superuser "postgres" is for administration only. On first start (empty volume) the
    # bootstrap script creates the roles veyra_owner (migrations) and veyra_app (API/worker,
    # subject to row-level security) and the database "veyra". The application never connects
    # as postgres: superusers bypass row-level security.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./packages/db/sql/bootstrap-roles.sql:/docker-entrypoint-initdb.d/10-bootstrap-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d veyra"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for uploaded files (ADR 0007). SeaweedFS checks request
  # signatures with the development credentials in infra/seaweedfs/s3.json. S3 API on :8333.
  storage:
    image: chrislusf/seaweedfs:4.48
    command: server -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - storage-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the development bucket once storage is up, then exits.
  storage-setup:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "echo 's3.bucket.create -name veyra-dev' | weed shell -master=storage:9333 -filer=storage:8888"

volumes:
  postgres-data:
  storage-data:
